name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Erros de restore/build viram anotações no GitHub (visíveis na aba Checks e pela API).
      - name: Restore
        run: |
          set -o pipefail
          dotnet restore LedgerFinanceiro.slnx 2>&1 | tee restore.log || { grep -E "error" restore.log | sort -u | head -30 | sed 's/^/::error::/'; exit 1; }

      # TreatWarningsAsErrors está no Directory.Build.props: qualquer warning quebra o build.
      - name: Build
        run: |
          set -o pipefail
          dotnet build LedgerFinanceiro.slnx --no-restore -c Release 2>&1 | tee build.log || { grep -E "(error|warning) [A-Z]+[0-9]+" build.log | sort -u | head -40 | sed 's/^/::error::/'; exit 1; }

      - name: Testes (unitários e integração com Testcontainers)
        run: dotnet test LedgerFinanceiro.slnx --no-build -c Release --logger "trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Resumo dos testes
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns={'t':'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          linhas=[]
          for f in sorted(glob.glob('TestResults/*.trx')):
              r=ET.parse(f).getroot()
              c=r.find('t:ResultSummary/t:Counters',ns).attrib
              nome=r.find('t:TestDefinitions/t:UnitTest',ns).attrib['storage'].split('/')[-1]
              linhas.append(f"{nome}: {c['passed']}/{c['total']} aprovados, {c['failed']} falhas")
          for l in linhas: print(f"::notice::{l}")
          open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a').write("## Testes\n"+"\n".join("- "+l for l in linhas)+"\n")
          PY

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  e2e:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir o ambiente completo (docker compose)
        run: docker compose up -d --build --wait --wait-timeout 420

      - name: Teste ponta a ponta
        run: ./scripts/e2e.sh

      - name: Logs em caso de falha
        if: failure()
        run: |
          docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' | sed 's/^/::warning::/'
          for s in $(docker compose ps -a --format '{{.Service}} {{.State}} {{.Health}}' | awk '$2!="running" || $3=="unhealthy" {print $1}' | sort -u); do
            docker compose logs --no-color --tail=6 $s 2>&1 | cut -c1-400 | sed "s/^/::error::/"
          done
