name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      # Erros de restore/build viram anotações no GitHub (visíveis na aba Checks e pela API).
      - name: Restore
        run: |
          set -o pipefail
          dotnet restore LedgerFinanceiro.slnx 2>&1 | tee restore.log || { grep -E "error" restore.log | sort -u | head -30 | sed 's/^/::error::/'; exit 1; }

      # TreatWarningsAsErrors está no Directory.Build.props: qualquer warning quebra o build.
      - name: Build
        run: |
          set -o pipefail
          dotnet build LedgerFinanceiro.slnx --no-restore -c Release 2>&1 | tee build.log || { grep -E "(error|warning) [A-Z]+[0-9]+" build.log | sort -u | head -40 | sed 's/^/::error::/'; exit 1; }

      - name: Testes (unitários e integração com Testcontainers)
        run: dotnet test LedgerFinanceiro.slnx --no-build -c Release --logger "trx" --collect:"XPlat Code Coverage" --results-directory TestResults

      - name: Resumo dos testes
        if: always()
        run: |
          python3 - <<'PY'
          import glob, xml.etree.ElementTree as ET
          ns={'t':'http://microsoft.com/schemas/VisualStudio/TeamTest/2010'}
          linhas=[]
          for f in sorted(glob.glob('TestResults/*.trx')):
              r=ET.parse(f).getroot()
              c=r.find('t:ResultSummary/t:Counters',ns).attrib
              nome=r.find('t:TestDefinitions/t:UnitTest',ns).attrib['storage'].split('/')[-1]
              linhas.append(f"{nome}: {c['passed']}/{c['total']} aprovados, {c['failed']} falhas")
          for l in linhas: print(f"::notice::{l}")
          open(__import__('os').environ['GITHUB_STEP_SUMMARY'],'a').write("## Testes\n"+"\n".join("- "+l for l in linhas)+"\n")
          PY

      - name: Publicar resultados
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: TestResults

  e2e:
    needs: build-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Subir o ambiente completo (docker compose)
        run: |
          set -o pipefail
          docker compose up -d --build --wait --wait-timeout 420 2>&1 | tee compose-up.log || {
            grep -iE "error|failed|not found|denied" compose-up.log | grep -v "^ *#" | sort -u | tail -15 | cut -c1-400 | sed 's/^/::error::/'
            exit 1
          }

      - name: Teste ponta a ponta
        run: ./scripts/e2e.sh

      - name: Teste de carga (k6)
        run: |
          set -o pipefail
          ./scripts/carga.sh 2>&1 | tee carga.log || { tail -25 carga.log | cut -c1-300 | sed 's/^/::error::/'; exit 1; }
          sed 's/^/::notice::/' resultados-carga/resumo.md
          grep -o 'FALHA .*' carga.log | head -15 | cut -c1-250 | sed 's/^/::warning::/' || true
          { echo "## Teste de carga"; cat resultados-carga/resumo.md; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar resultados da carga
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: resultados-carga
          path: resultados-carga

      - name: Logs em caso de falha
        if: failure()
        run: |
          docker compose ps -a --format '{{.Service}} {{.State}} {{.Status}}' | sed 's/^/::warning::/'
          for s in lancamentos-api consolidado-api gateway consolidado-worker; do
            docker compose logs --no-color $s 2>&1 | grep -E '"LogLevel":"(Error|Critical)"|Unhandled|Exception' | tail -2 | cut -c1-600 | sed "s/^/::error::$s /"
          done

  mutacao:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Instalar Stryker.NET
        run: dotnet tool install -g dotnet-stryker

      - name: Mutação no domínio de Lançamentos
        working-directory: tests/Lancamentos.UnitTests
        run: dotnet stryker --config-file stryker-config.json

      - name: Mutação no núcleo do Consolidado
        working-directory: tests/Consolidado.UnitTests
        run: dotnet stryker --config-file stryker-config.json

      - name: Resumo
        if: always()
        run: |
          python3 scripts/resumo-stryker.py --github
          { echo "## Testes de mutação"; python3 scripts/resumo-stryker.py; } >> "$GITHUB_STEP_SUMMARY"

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-stryker
          path: tests/*/StrykerOutput/**/reports/
